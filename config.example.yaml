# =============================================================================
#  CONFIGURAZIONE — copia questo file in "config.yaml" e modifica i valori.
#  (config.yaml NON viene versionato: contiene le tue impostazioni personali)
# =============================================================================

# -----------------------------------------------------------------------------
# 1) DA DOVE ARRIVA IL MATERIALE (i "job")
# -----------------------------------------------------------------------------
source:
  type: local            # "local" = cartella sul disco  |  "gdrive" = Google Drive

  local:
    path: ./material     # ogni sottocartella qui dentro è un job

  gdrive:
    folder_id: ""                                   # ID della cartella "madre" su Drive
    credentials_file: ./gdrive-service-account.json # credenziali service account
    download_dir: ./material                        # dove scarica i job da Drive

# -----------------------------------------------------------------------------
# 2) AUTOMAZIONE DEL SITO STITCH
#    NB: i "selettori" qui sotto sono la mappa dei punti su cui cliccare/scrivere
#        nella pagina di Stitch. Vanno calibrati sull'interfaccia reale (vedi README).
# -----------------------------------------------------------------------------
stitch:
  url: "https://stitch.withgoogle.com/"
  model: "3.1 Pro"          # modello da tenere SEMPRE (gate anti-downgrade a "3 Flash")
  version: "web"            # "web" (non "app") - si sceglie una volta a inizio progetto
  headless: true            # true sul server/Colab; false in locale per vedere il browser
  browser_channel: null     # null = Chromium (Linux/Colab); "chrome" = Chrome vero (Mac locale)
  user_data_dir: "./.stitch_profile"   # sessione di login Google/Stitch salvata qui
  slow_mo_ms: 50            # rallenta le azioni (utile in debug)

  phase_wait_seconds: 180        # attesa tra una fase (prompt) e la successiva
  download_timeout_seconds: 1800 # attesa MAX per il download dello ZIP finale
  model_gate_retries: 3          # quante volte riprovare a forzare 3.1 Pro prima di STOP
  debug_dir: "./debug"           # screenshot + DOM dei frame quando qualcosa non va

  timeouts:
    navigation_ms: 60000       # attesa caricamento pagina
    generation_ms: 900000      # attesa MAX per la generazione di Stitch (qui 15 min)

  # ---- SELETTORI (da CALIBRARE sull'interfaccia reale di Stitch) ----
  # Ogni voce può essere una stringa O una lista di candidati: il sender prova
  # il primo che esiste (in pagina o dentro l'iframe di Stitch).
  selectors:
    version_web_toggle:             # scheda/pulsante "Web" (NON "App")
      - "button:has-text('Web')"
      - "[role='tab']:has-text('Web')"
      - "text=Web"
    version_app_toggle:             # scheda/pulsante "App" (per riferimento)
      - "button:has-text('App')"
      - "[role='tab']:has-text('App')"
    prompt_input:
      - "textarea"
      - "[contenteditable='true']"
      - "[role='textbox']"
    image_upload_input:
      - "input[type='file']"
    submit_button:
      - "button[type='submit']"
      - "button[aria-label*='Send' i]"
      - "button:has-text('Send')"
    model_menu_button:              # apre il menu di scelta modello
      - "button:has-text('Pro')"
      - "button:has-text('Flash')"
      - "[data-testid='model-selector']"
    model_option:                   # la voce "3.1 Pro" nel menu
      - "text=3.1 Pro"
      - "[role='option']:has-text('3.1 Pro')"
    model_current_label:            # etichetta del modello attivo (per il gate)
      - "[data-testid='model-selector']"
      - "button:has-text('Pro')"
    generation_done:                # elemento che compare a fine generazione
      - "text=Download"
      - "[data-testid='generation-complete']"
    download_button:                # scarica lo ZIP del risultato
      - "button:has-text('Download')"
      - "button[aria-label*='Download' i]"

# -----------------------------------------------------------------------------
# 3) COME COSTRUIRE IL PROMPT
# -----------------------------------------------------------------------------
prompt:
  mode: "passthrough"    # "passthrough" = invia i .md così come sono (consigliato)
                         # "claude"      = fa rielaborare/adattare i .md a Claude prima di inviare
  claude:
    model: "claude-opus-4-8"
    max_tokens: 4000
    system: "Sei un assistente che adatta prompt per Stitch. Mantieni intatte le istruzioni tecniche."
    # La chiave API si mette in .env come ANTHROPIC_API_KEY (non qui)

# -----------------------------------------------------------------------------
# 4) COSA SALVARE COME RISULTATO
# -----------------------------------------------------------------------------
result:
  type: "code"           # "code" = salva il codice esportato | "screenshot" | "link" | "none"
  output_dir: ./results  # i risultati finiscono in results/<nome_job>/

# -----------------------------------------------------------------------------
# 5) LOOP 24/7
# -----------------------------------------------------------------------------
loop:
  poll_interval_sec: 60  # ogni quanti secondi cerca nuovi job
  once: false            # true = processa i job in coda una volta sola e poi esce (utile per test)
